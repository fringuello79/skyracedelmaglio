<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dove sono — Skyrace del Maglio</title>
<meta name="description" content="La tua posizione rispetto al percorso della Skyrace del Maglio 2026, con sentieri e confini comunali.">
<meta name="theme-color" content="#153821">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Oswald:wght@500;700&display=swap">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
:root {
  --bosco: #153821; --sole: #FF8102; --avorio: #f3efe2; --carta: #fffdf7; --inchiostro: #1b241d; --tenue: #5c6559;
  --linea: #ddd6c3; --confine: #6b2fa0; --blu: #1a73e8;
  --ombra: 0 6px 22px rgba(0,0,0,.22);
  --font-titolo: 'Oswald', 'Arial Narrow', sans-serif; --font-testo: 'Atkinson Hyperlegible', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --carta: #18231b; --avorio: #223126; --inchiostro: #ece8dc; --tenue: #b5b9ad; --linea: #3b4b3f; color-scheme: dark; }
}
:root[data-theme="dark"] { --carta: #18231b; --avorio: #223126; --inchiostro: #ece8dc; --tenue: #b5b9ad; --linea: #3b4b3f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bosco); color: var(--inchiostro); font: 16px/1.4 var(--font-testo); display: flex; flex-direction: column; overflow: hidden; }

.barra { display: flex; align-items: center; gap: 10px; padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--bosco); color: #f3efe2; z-index: 1200; }
.barra a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.barra img { width: 34px; height: 37px; object-fit: contain; flex: none; }
.barra h1 { margin: 0; font: 700 19px/1.05 var(--font-titolo); letter-spacing: .02em; text-transform: uppercase; }
.barra p { margin: 0; font-size: 12.5px; opacity: .8; }

#mappa { flex: 1; min-height: 0; background: #c9cfc3; }

/* scheda della posizione */
.scheda {
  position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 1100;
  max-width: 460px; margin: 0 auto; background: var(--carta); border-radius: 16px; box-shadow: var(--ombra);
  padding: 14px 16px 14px; border-top: 4px solid var(--sole);
}
.scheda .titolo { font: 700 22px/1.15 var(--font-titolo); margin: 0 0 2px; color: var(--inchiostro); }
.scheda .sotto { margin: 0; color: var(--tenue); font-size: 14.5px; }
.righe { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 15.5px; }
.righe dt { color: var(--tenue); }
.righe dd { margin: 0; font-weight: 700; }
.btn {
  appearance: none; border: 0; border-radius: 12px; background: var(--sole); color: #1b1200; font: 700 17px/1 var(--font-testo);
  padding: 14px 16px; width: 100%; margin-top: 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; justify-content: center;
}
.btn:focus-visible, .btn-mappa:focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
.nota { margin: 8px 0 0; font-size: 12.5px; color: var(--tenue); }
.errore { color: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .errore { color: #ffb4ab; } }

/* pulsanti sulla mappa */
.comandi { position: fixed; right: 12px; top: calc(66px + env(safe-area-inset-top)); z-index: 1100; display: flex; flex-direction: column; gap: 8px; }
.btn-mappa {
  width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--carta); color: var(--inchiostro); box-shadow: var(--ombra);
  display: grid; place-items: center; cursor: pointer;
}
.btn-mappa[hidden] { display: none; }
.btn-mappa.attivo { background: var(--blu); color: #fff; }
.menu-livelli {
  position: fixed; right: 66px; top: calc(66px + env(safe-area-inset-top)); z-index: 1150; background: var(--carta); color: var(--inchiostro);
  border-radius: 14px; box-shadow: var(--ombra); padding: 12px 14px; min-width: 210px; font-size: 15px;
}
.menu-livelli[hidden] { display: none; }
.menu-livelli h2 { font: 700 13px/1 var(--font-titolo); text-transform: uppercase; letter-spacing: .06em; color: var(--tenue); margin: 4px 0 8px; }
.menu-livelli h2 + label { margin-top: 0; }
.menu-livelli label { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
.menu-livelli hr { border: 0; border-top: 1px solid var(--linea); margin: 8px 0; }
.legenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.legenda li { display: flex; align-items: center; gap: 10px; }
.legenda svg { flex: none; }

/* marcatori */
.mk-km, .mk-me, .mk-chevron, .mk-comune { background: none; border: 0; }
.mk-km span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bosco); color: #f3efe2; font: 700 11px/1 var(--font-testo); border: 1.5px solid var(--sole); }
.mk-me div { width: 20px; height: 20px; border-radius: 50%; background: var(--blu); border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,.35), 0 1px 4px rgba(0,0,0,.4); }
.mk-comune span {
  display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font: 700 13px/1 var(--font-titolo); letter-spacing: .08em;
  text-transform: uppercase; color: #fff; background: rgba(107,47,160,.82); padding: 4px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.7);
}
.z-lontano .mk-km { display: none; }
.tile-attenuata { filter: saturate(.55); }
.leaflet-tooltip.tip { font: 700 13px/1.2 var(--font-testo); border-radius: 8px; border: 0; box-shadow: var(--ombra); padding: 5px 8px; }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-control-scale-line { border-color: var(--bosco); }
.leaflet-bottom { bottom: var(--spazio-scheda, 0px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="barra">
  <a href="../" aria-label="Torna al sito della Skyrace del Maglio">
    <img src="logo-srm.png" alt="" width="34" height="37">
    <div><h1>Dove sono</h1><p>rispetto al percorso della Skyrace del Maglio</p></div>
  </a>
</header>

<div id="mappa" aria-label="Mappa del percorso di gara con la tua posizione"></div>

<div class="comandi">
  <button class="btn-mappa" id="btnSegui" aria-label="Centra sulla mia posizione" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button class="btn-mappa" id="btnTutto" aria-label="Mostra tutto il percorso">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn-mappa" id="btnLivelli" aria-label="Mappa e legenda" aria-expanded="false" aria-controls="livelli">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="menu-livelli" id="livelli" hidden>
  <h2>Mappa</h2>
  <label><input type="radio" name="base" value="satellite"> Satellite</label>
  <label><input type="radio" name="base" value="topo"> Topografica</label>
  <label><input type="radio" name="base" value="osm"> Stradale</label>
  <hr>
  <label><input type="checkbox" value="sentieri"> Sentieri segnati</label>
  <label><input type="checkbox" value="comuni"> Confini comunali</label>
  <hr>
  <h2>Legenda</h2>
  <ul class="legenda">
    <li><svg width="34" height="10" aria-hidden="true"><path d="M2 5h30" stroke="#153821" stroke-width="8" stroke-linecap="round"/><path d="M2 5h30" stroke="#FF8102" stroke-width="4.5" stroke-linecap="round"/></svg>Percorso di gara</li>
    <li><svg width="34" height="10" aria-hidden="true"><path d="M2 5h30" stroke="#153821" stroke-width="8" stroke-linecap="round"/><path d="M2 5h30" stroke="#FF8102" stroke-width="4.5" stroke-linecap="round"/><path d="M3 5h28" stroke="#fff" stroke-width="2" stroke-dasharray="2 6"/></svg>Tratto fatto due volte</li>
    <li><svg width="34" height="10" aria-hidden="true"><path d="M2 5h30" stroke="#800e14" stroke-width="3" stroke-linecap="round"/></svg>Sentieri segnati</li>
    <li><svg width="34" height="10" aria-hidden="true"><path d="M2 5h30" stroke="#fff" stroke-width="5"/><path d="M2 5h30" stroke="#6b2fa0" stroke-width="2.5" stroke-dasharray="7 4"/></svg>Confine comunale</li>
    <li><svg width="34" height="20" aria-hidden="true"><circle cx="17" cy="10" r="7" fill="#1a73e8" stroke="#fff" stroke-width="2.5"/></svg>Tu</li>
  </ul>
</div>

<section class="scheda" id="scheda" aria-live="polite"></section>

<script src="leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
