# Orologio SRM: prova il motore della guida (C++ contro motore.js) e compila il firmware Meshtastic per il T-Watch Ultra.
# Il firmware compilato si scarica dalla pagina dell'esecuzione, nella sezione «Artifacts».
name: Firmware orologio SRM
on:
  push:
    paths:
      - 'orologio/firmware/**'
      - 'guida/motore.js'
      - 'guida/bivi-srm2026.json'
      - '.github/workflows/orologio-firmware.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motore C++ contro motore.js
        run: sh orologio/firmware/prove/esegui.sh

  firmware:
    needs: prove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Firmware Meshtastic (versione provata)
        run: |
          git clone --filter=blob:none https://github.com/meshtastic/firmware.git fw
          git -C fw checkout 332b5b0a2c4fec2896de3c5fa63f46d5cd05ea98
          git -C fw submodule update --init --recursive
      - name: Strumenti
        run: pip install -r fw/.github/actions/setup-base/requirements.txt
      - name: Inserisce la Guida SRM
        run: python3 orologio/firmware/meshtastic/integra.py fw
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-srm-${{ hashFiles('fw/**/*.ini') }}
      - name: Compila per il T-Watch Ultra
        shell: bash
        run: |
          cd fw
          set +e
          bash bin/build-esp32.sh t-watch-ultra-srm > build.log 2>&1
          esito=$?
          tail -n 40 build.log
          # errori come annotazioni (leggibili anche senza scaricare il registro)
          grep -nE "error:|Error [0-9]|undefined reference|fatal" build.log | head -n 60 > errori.txt || true
          if [ -s errori.txt ]; then
            for parte in 0 1 2 3 4 5; do
              righe=$(sed -n "$((parte*10+1)),$((parte*10+10))p" errori.txt | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
              [ -n "$righe" ] && echo "::error title=compilazione $parte::$righe"
            done
          fi
          if [ $esito -ne 0 ]; then
            n=$(grep -n "\*\*\* \[" build.log | head -n 1 | cut -d: -f1)
            if [ -n "$n" ]; then
              echo "::error title=prima dell'errore::$(sed -n "$((n>40?n-40:1)),$((n+2))p" build.log | grep -v "^Compiling\|^Archiving\|^Indexing" | cut -c1-300 | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            fi
            echo "::error title=coda::$(tail -n 12 build.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $esito
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-orologio-srm
          path: |
            fw/release/*.bin
            fw/release/device-install.*
            fw/release/device-update.*
