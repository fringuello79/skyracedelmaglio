<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c1f14"><title>SRM Explorer · Skyrace del Maglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>

:root{--forgia:#0c1f14;--bosco:#11301f;--felce:#4f9239;--brace:#f4951f;--ferro:#9aa6a0;--avorio:#f3efe2;--cuoio:#a9612f;--line:rgba(243,239,226,.16);--lens:min(55vw,54vh,570px);}
*{box-sizing:border-box}html{background:var(--forgia)}body{margin:0;color:var(--avorio);font:16px/1.5 Inter,Arial,sans-serif;overflow-x:hidden}button{font:inherit}a{color:inherit;text-decoration:none}.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em}.topbar{height:72px;position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,64px);border-bottom:1px solid var(--line);background:rgba(12,31,20,.94)}.brand{display:flex;gap:13px;align-items:center}.brand img{height:43px;width:43px;object-fit:contain;border-radius:50%}.brand strong{display:block;font:700 18px Oswald,sans-serif;line-height:1;letter-spacing:.07em}.brand em{display:block;font:italic 12px Fraunces,serif;color:var(--ferro);margin-top:3px}.back{font:500 13px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);padding:10px 16px;border-radius:6px}.back:hover{border-color:var(--brace)}

html,body{height:100%}body{overflow:hidden;display:flex;flex-direction:column}
.topbar{flex:none}
.top-actions{display:flex;gap:10px;align-items:center}
.back.full{border-color:rgba(244,149,31,.5);color:var(--brace)}
.app{position:relative;flex:1 1 auto;min-height:0;background:#0c1f14}
.app iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media(max-width:750px){.topbar{height:56px;padding:0 12px}.brand img{height:36px;width:36px}.brand em{display:none}.brand strong{font-size:15px}.back{font-size:11px;padding:7px 9px}}
@media(max-width:420px){.brand div{display:none}}
</style></head><body><header class="topbar"><a href="index.html" class="brand"><img src="assets/Srm%20logo.png" alt=""><div><strong>Skyrace del Maglio</strong><em>SRM Explorer · il percorso in 3D</em></div></a>
<div class="top-actions"><a class="back full" href="assets/explorer/index.html" target="_blank" rel="noopener">⤢ Schermo intero</a><a class="back" href="index.html">← Torna al sito</a></div></header>
<main class="app"><iframe id="srmx" src="assets/explorer/index.html" title="SRM Explorer — il percorso della Skyrace del Maglio in 3D" allow="fullscreen" allowfullscreen></iframe></main>
<script>
/* L'Explorer si comanda anche con le frecce: diamo il focus all'app appena caricata */
const f=document.getElementById('srmx');f.addEventListener('load',()=>{try{f.contentWindow.focus()}catch(e){}});
</script>
</body></html>
